<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Apple Viewer</title>
  <link rel="preload" href="/assets/apple.glb" as="model">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0b1220; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/loaders/GLTFLoader.js';
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1220);
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 4);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    
    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 5, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);
    
    // Load the GLB apple
    const loader = new GLTFLoader();
    loader.load(
      '/assets/apple.glb',
      (gltf) => {
        const apple = gltf.scene;
        apple.scale.set(0.01, 0.01, 0.01);
        apple.position.set(0, 0.5, 0);
        apple.rotation.y = 0.2;
        apple.rotation.x = -0.1;
        scene.add(apple);
        
        // Add rotation animation
        const rotate = () => {
          apple.rotation.y += 0.01;
          requestAnimationFrame(rotate);
        };
        rotate();
      },
      (xhr) => {
        console.log((xhr.loaded / xhr.total * 100) + '% loaded');
      },
      (error) => {
        console.error('Error loading GLB:', error);
        // Fallback: procedural apple
        const geometry = new THREE.SphereGeometry(0.5, 64, 64);
        const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const apple = new THREE.Mesh(geometry, material);
        apple.position.set(0, 0.5, 0);
        scene.add(apple);
      }
    );
    
    // Camera controls
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    
    // Animation loop
    const animate = () => {
      renderer.render(scene, camera);
      controls.update();
      requestAnimationFrame(animate);
    };
    animate();
    
    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
