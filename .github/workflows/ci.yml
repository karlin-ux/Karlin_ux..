name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: karlin_ux
          POSTGRES_USER: karlin_ux
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: test-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: karlin_ux
      POSTGRES_USER: karlin_ux
      POSTGRES_PASSWORD: testpassword
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r Backend/requirements.txt
      - name: Django system check
        run: cd Backend && python manage.py check
      - name: Migration check
        run: cd Backend && python manage.py makemigrations --check --dry-run
      - run: cd Backend && python manage.py migrate --noinput
      - run: cd Backend && python manage.py seed_showcase
      - run: cd Backend && python manage.py test
      - name: Bandit security scan
        run: cd Backend && python -m bandit -r . --exclude="./migrations" -ll

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd Frontend && npm ci
      - name: TypeScript check
        run: cd Frontend && npx tsc --noEmit
      - name: Lint
        run: cd Frontend && npm run lint
      - name: Production build
        run: cd Frontend && npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Backend/Dockerfile -t karlin-backend:test ./Backend
      - name: Validate docker-compose
        run: docker compose config