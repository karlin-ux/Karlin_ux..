name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: karlin_ux
          POSTGRES_USER: karlin_ux
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: test-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: karlin_ux
      POSTGRES_USER: karlin_ux
      POSTGRES_PASSWORD: testpassword
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r Backend/requirements.txt
      - name: Install Bandit
        run: pip install bandit==1.9.4
      - name: Django system check
        run: cd Backend && python manage.py check
      - name: Migration check
        run: cd Backend && python manage.py makemigrations --check --dry-run
      - run: cd Backend && python manage.py migrate --noinput
      - run: cd Backend && python manage.py seed_showcase
      - run: cd Backend && python manage.py test
      - name: Bandit (medium/high gate)
        run: cd Backend && bandit -r . --exclude ./migrations -ll
      - name: Bandit (full low-severity report)
        if: always()
        run: cd Backend && bandit -r . --exclude ./migrations -f json -o bandit-report.json || true
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: Backend/bandit-report.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd Frontend && npm ci
      - name: TypeScript check
        run: cd Frontend && npx tsc --noEmit
      - name: Lint
        run: cd Frontend && npm run lint
      - name: Production build
        run: cd Frontend && npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        env:
          POSTGRES_PASSWORD: testpassword
          DJANGO_SECRET_KEY: test-secret-key-not-for-production
        run: docker compose config >/dev/null
      - name: Build backend image
        run: docker build -f Backend/Dockerfile -t karlin-backend:ci ./Backend
      - name: Verify non-root runtime user
        run: test "$(docker image inspect karlin-backend:ci --format '{{.Config.User}}')" = "appuser"
      - name: Smoke-test installed Python packages
        run: docker run --rm --entrypoint python karlin-backend:ci -c "import django, rest_framework, psycopg; print('ok')"

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Backend/Dockerfile -t karlin-backend:ci ./Backend

      # Gate 1: application dependencies, secrets and Dockerfile/compose config.
      - name: "Trivy filesystem (gate: fixable CRITICAL/HIGH)"
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: table

      # Gate 2: the image we ship.
      - name: "Trivy backend image (gate: fixable CRITICAL/HIGH)"
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: karlin-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: table

      # Gate 3: base images fail on CRITICAL only. HIGH findings are reported
      # below and reviewed, because upstream images often lag their Go/OS deps.
      - name: "Trivy postgres base image (gate: fixable CRITICAL)"
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: postgres:18.6-alpine
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: table

      - name: "Trivy caddy base image (gate: fixable CRITICAL)"
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: caddy:2.11.9-alpine
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: table

      # Reports: all severities, never blocking. These keep existing findings
      # visible instead of silently ignoring them.
      - name: Trivy filesystem report (all severities, SARIF)
        if: always()
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          trivyignores: .trivyignore
          format: sarif
          output: trivy-sarif/fs.sarif
          exit-code: "0"

      - name: Trivy backend image report (all severities, SARIF)
        if: always()
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: karlin-backend:ci
          trivyignores: .trivyignore
          format: sarif
          output: trivy-sarif/backend.sarif
          exit-code: "0"

      - name: Trivy postgres base image report (HIGH+, table)
        if: always()
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: postgres:18.6-alpine
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          format: table
          exit-code: "0"

      - name: Trivy caddy base image report (HIGH+, table)
        if: always()
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: caddy:2.11.9-alpine
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          format: table
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-sarif
          category: trivy
